# Self-hosted GPU deployment (any Linux host with an NVIDIA GPU + Docker +
# NVIDIA Container Toolkit). See docs/deploy-self-hosted.md for the runbook.
#
# Mirrors the production stack that terraform/envs/sandbox/user-data.sh.tpl
# bootstraps on AWS, minus AWS-specific glue (ECR login, SSM secret fetch,
# Route53/ALB TLS). All secrets live in .env (gitignored).

services:
  ollama:
    image: ollama/ollama:latest
    # GPU access via the modern device-reservation spec. Requires the host to
    # have nvidia-container-toolkit installed + registered with Docker:
    #   sudo nvidia-ctk runtime configure --runtime=docker
    #   sudo systemctl restart docker
    # (The legacy `runtime: nvidia` shortcut needs an explicit named runtime in
    # /etc/docker/daemon.json — this block doesn't.)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      # Keep a model in VRAM for 5 min after last use. Increase for fewer cold
      # swaps, decrease for tighter VRAM pressure.
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_NUM_PARALLEL: 1
      # Single 16 GB GPU fits one of llama3.1:8b / gemma4 / qwen2.5-coder:7b at
      # a time. Raise on a larger GPU (e.g. 2 on a 24 GB card).
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  litellm:
    build:
      context: ../../gateway
    command: ["--config", "/etc/litellm/config.cloud.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_HOST_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Public URL behind the Tailscale Serve TLS terminator. Without this,
      # LiteLLM builds /ui redirects with the local (HTTP) scheme.
      PROXY_BASE_URL: ${PROXY_BASE_URL:-https://ai-worker2.tail6156a3.ts.net:8443}
      # uvicorn won't honour X-Forwarded-Proto unless the source IP is trusted.
      # Tailscale Serve hits us via the Docker bridge gateway (172.x.0.1), not
      # 127.0.0.1, so the default trust list rejects the header. "*" trusts
      # any source — safe because nothing outside this compose network can
      # reach the gateway container directly.
      FORWARDED_ALLOW_IPS: "*"
      # Langfuse tracing (success/failure callbacks in config.cloud.yaml)
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse-web:3000}
      # Replace the default LiteLLM logo in /ui with the company brand.
      UI_LOGO_PATH: ${UI_LOGO_PATH:-https://ejadtech.sa/web/image/website/1/header_logo/%D8%A5%D9%8A%D8%AC%D8%A7%D8%AF%20%D8%A7%D9%84%D8%AA%D9%82%D9%86%D9%8A%D8%A9%20%D9%84%D8%AA%D9%82%D9%86%D9%8A%D8%A9%20%D8%A7%D9%84%D9%85%D8%B9%D9%84%D9%88%D9%85%D8%A7%D8%AA}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 3g
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: langfuse-minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    environment: &langfuse-env
      DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse-minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    mem_limit: 2g
    restart: unless-stopped

  langfuse-web:
    image: langfuse/langfuse:3
    depends_on:
      langfuse-worker:
        condition: service_started
    ports:
      - "${LANGFUSE_HOST_PORT:-3000}:3000"
    environment:
      <<: *langfuse-env
      # If reaching Langfuse over Tailscale by hostname, set
      # NEXTAUTH_URL=http://<tailscale-host>:3000 in .env so login redirects work.
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-self-hosted}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-Self-Hosted}
      LANGFUSE_INIT_PROJECT_ID: llm-platform
      LANGFUSE_INIT_PROJECT_NAME: llm-platform
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-admin@local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD}
    mem_limit: 2g
    restart: unless-stopped

  orchestration:
    build:
      context: ../../orchestration
    ports:
      - "${ORCHESTRATION_HOST_PORT:-8000}:8000"
    environment:
      ORCH_GATEWAY_BASE_URL: http://litellm:4000
      ORCH_GATEWAY_VIRTUAL_KEY: ${LITELLM_MASTER_KEY}
      ORCH_GATEWAY_ADMIN_KEY: ${LITELLM_MASTER_KEY}
      ORCH_REDIS_URL: redis://redis:6379/0
      ORCH_DATABASE_URL: postgresql://platform:${POSTGRES_PASSWORD}@postgres:5432/orchestration
      ORCH_LANGFUSE_HOST: http://langfuse-web:3000
      ORCH_LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      ORCH_LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
    depends_on:
      litellm:
        condition: service_started
      langfuse-web:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama-data:
  postgres-data:
  clickhouse-data:
  minio-data:
