# Local compose-harness config. Same logical names and fallback chains as
# config.yaml, but every physical backend resolves to the mock-openai service,
# so routing, virtual keys, streaming, and fallback are testable with no AWS,
# no GPUs, and no frontier spend.
#
# "Local" entries keep their manifest_id so scripts/validate_routes.py applies
# the same manifest↔route invariant to this file. "Frontier" entries resolve to
# mock model names prefixed mock-frontier-*.
#
# Fallback testing: set MOCK_FAIL_MODELS=base-bilingual-14b-awq on the
# mock-openai service and kleem-realtime / chat-default will be served by their
# frontier fallback aliases.

model_list:
  - model_name: kleem-realtime
    litellm_params:
      model: openai/base-bilingual-14b-awq
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 30
    model_info:
      source: local
      manifest_id: base-bilingual-14b-awq

  - model_name: kleem-realtime-frontier
    litellm_params:
      model: openai/mock-frontier-fast
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 30
    model_info:
      source: frontier

  - model_name: chat-default
    litellm_params:
      model: openai/base-bilingual-14b-awq
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 120
    model_info:
      source: local
      manifest_id: base-bilingual-14b-awq

  - model_name: chat-default-frontier
    litellm_params:
      model: openai/mock-frontier-default
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 120
    model_info:
      source: frontier

  - model_name: qams-rag
    litellm_params:
      model: openai/mock-frontier-quality
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 300
    model_info:
      source: frontier

  - model_name: summarize-cheap
    litellm_params:
      model: openai/kleem-summarize-lora-v1
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 300
    model_info:
      source: local
      manifest_id: kleem-summarize-lora-v1

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - kleem-realtime: ["kleem-realtime-frontier"]
    - chat-default: ["chat-default-frontier"]
    - summarize-cheap: ["chat-default-frontier"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
