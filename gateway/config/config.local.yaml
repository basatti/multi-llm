# Local compose harness — same shape as config.yaml but every physical
# backend resolves to the mock-openai service. Routing/keys/streaming/
# fallback all testable with no AWS, no GPUs, no real models.
#
# Override the mock failure set to test fallback chains:
#   MOCK_FAIL_MODELS=llama3.1:8b docker compose up

model_list:
  - model_name: llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 60
    model_info:
      source: local
      manifest_id: llama3.1-8b

  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 60
    model_info:
      source: local
      manifest_id: gemma4-latest

  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 60
    model_info:
      source: local
      manifest_id: qwen2.5-coder-7b

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - llama3.1: ["gemma4"]
    - gemma4: ["llama3.1"]
    - qwen2.5-coder: ["llama3.1"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
