# Production / self-hosted-GPU routing for the gateway.
#
# Three real-named models served by Ollama on the same GPU. Apps pass these
# names in the OpenAI `model` field; virtual keys are scoped to one (or more)
# at the LiteLLM admin layer. Each route falls back to a peer so requests
# during a model-swap or warmup don't fail.
#
# NOTE: terraform/envs/sandbox/user-data.sh.tpl currently inlines an identical
# copy that it writes to the EC2 instance. If you edit one, mirror the other
# until the AWS bootstrap is refactored to use this file directly.
model_list:
  - model_name: llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: llama3.1-8b

  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: gemma4-latest

  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: qwen2.5-coder-7b

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - llama3.1: ["gemma4"]
    - gemma4: ["llama3.1"]
    - qwen2.5-coder: ["llama3.1"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
