# Production / self-hosted-GPU routing for the gateway.
#
# Three real-named models served by Ollama on the same GPU. Apps pass these
# names in the OpenAI `model` field; virtual keys are scoped to one (or more)
# at the LiteLLM admin layer. Each route falls back to a peer so requests
# during a model-swap or warmup don't fail.
#
# NOTE: terraform/envs/sandbox/user-data.sh.tpl currently inlines an identical
# copy that it writes to the EC2 instance. If you edit one, mirror the other
# until the AWS bootstrap is refactored to use this file directly.
model_list:
  # Shadow prices benchmarked against real hosted OSS / small frontier models.
  # Not real cost — these models run on the local GPU. The values exist so
  # spend dashboards in Langfuse + LiteLLM have meaningful numbers.
  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      # $0.075 / 1M input, $0.30 / 1M output (≈ Gemini 1.5 Flash)
      input_cost_per_token: 0.000000075
      output_cost_per_token: 0.0000003
    model_info:
      source: local
      manifest_id: gemma4-latest

  - model_name: gpt-oss
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      # $0.30 / 1M input, $1.20 / 1M output (≈ mid-tier hosted OSS, e.g. Llama-3.1-70B)
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
    model_info:
      source: local
      manifest_id: gpt-oss-20b

  - model_name: qwen3-coder
    litellm_params:
      model: openai/qwen3-coder:30b
      api_base: http://ollama:11434/v1
      api_key: ollama
      timeout: 300
      # $0.20 / 1M input, $0.80 / 1M output (≈ hosted Qwen3-Coder on Together/Fireworks)
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000008
    model_info:
      source: local
      manifest_id: qwen3-coder-30b

  - model_name: bge-m3
    litellm_params:
      model: ollama/bge-m3
      api_base: http://ollama:11434
      timeout: 120
      # $0.02 / 1M tokens (≈ hosted bge-m3 / OpenAI text-embedding-3-small)
      input_cost_per_token: 0.00000002
      output_cost_per_token: 0
    model_info:
      mode: embedding
      output_vector_size: 1024
      source: local
      manifest_id: bge-m3

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - gemma4: ["gpt-oss"]
    - gpt-oss: ["gemma4"]
    - qwen3-coder: ["gpt-oss"]

litellm_settings:
  drop_params: true
  request_timeout: 300
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # Short aliases so callers can use model=qwen3 / gpt / gemma without knowing
  # the underlying tag. Resolved at the router layer, so callers still need the
  # canonical name in their key's `models` allow-list.
  model_group_alias:
    qwen: qwen3-coder
    gpt: gpt-oss
    gemma: gemma4

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
