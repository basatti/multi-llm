# Canonical AWS gateway routing. Three real-named models served from the same
# Ollama instance on the GPU box (hot-swap, one resident at a time on T4).
#
# Each route has model_info.source: local + manifest_id resolving to
# models/manifest.yaml (scripts/validate_routes.py enforces). Fallbacks point
# at peer models so a request mid-swap or during warmup finds something to
# answer it rather than 5xx.
#
# Apps pass the literal model_name in the OpenAI `model` field. Per-key scope
# is managed in the LiteLLM admin UI (https://litellm.kleem.io/ui/).

model_list:
  - model_name: llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: llama3.1-8b

  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: gemma4-latest

  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: os.environ/OLLAMA_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: qwen2.5-coder-7b

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - llama3.1: ["gemma4"]
    - gemma4: ["llama3.1"]
    - qwen2.5-coder: ["llama3.1"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
