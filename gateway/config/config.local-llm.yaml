# Local-harness overlay that routes the gateway at a REAL local LLM
# (Ollama or LM Studio on the host), instead of the mock backend.
#
# Backend URL is env-configurable (Ollama 11434 vs LM Studio 1234):
#   LOCAL_LLM_BASE_URL  default http://host.docker.internal:11434/v1
#
# The physical model id is fixed below; to switch models, edit the four
# `model:` lines and recompose. We deliberately resolve all three local
# logical names to the same model — fine for a smoke test, and proves that
# logical name routing is independent of physical capacity.
#
# Each local-backed route keeps a mock frontier fallback so the fallback
# chain demo still works if Ollama is down — same contract as the AWS config.

model_list:
  - model_name: kleem-realtime
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 120
    model_info:
      source: local
      manifest_id: base-bilingual-14b-awq

  - model_name: kleem-realtime-frontier
    litellm_params:
      model: openai/mock-frontier-fast
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 30
    model_info:
      source: frontier

  - model_name: chat-default
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: base-bilingual-14b-awq

  - model_name: chat-default-frontier
    litellm_params:
      model: openai/mock-frontier-default
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 120
    model_info:
      source: frontier

  - model_name: qams-rag
    litellm_params:
      model: openai/mock-frontier-quality
      api_base: http://mock-openai:8080/v1
      api_key: mock-key
      timeout: 300
    model_info:
      source: frontier

  - model_name: summarize-cheap
    litellm_params:
      model: openai/qwen2.5:7b-instruct
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: kleem-summarize-lora-v1

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - kleem-realtime: ["kleem-realtime-frontier"]
    - chat-default: ["chat-default-frontier"]
    - summarize-cheap: ["chat-default-frontier"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
