# Local-harness overlay that routes the gateway at a REAL local LLM
# (Ollama or LM Studio on the dev machine), instead of the mock backend.
#
# Backend URL is env-configurable:
#   LOCAL_LLM_BASE_URL  default http://host.docker.internal:11434/v1  (Ollama)
#   set to http://host.docker.internal:1234/v1                        (LM Studio)
#
# The physical model ids assume Ollama on the dev box has llama3.1,
# gemma4, and qwen2.5-coder pulled. Tweak `model:` lines as needed.

model_list:
  - model_name: llama3.1
    litellm_params:
      model: openai/llama3.1:8b
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: llama3.1-8b

  - model_name: gemma4
    litellm_params:
      model: openai/gemma4:latest
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: gemma4-latest

  - model_name: qwen2.5-coder
    litellm_params:
      model: openai/qwen2.5-coder:7b
      api_base: os.environ/LOCAL_LLM_BASE_URL
      api_key: ollama
      timeout: 300
    model_info:
      source: local
      manifest_id: qwen2.5-coder-7b

router_settings:
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  num_retries: 1
  fallbacks:
    - llama3.1: ["gemma4"]
    - gemma4: ["llama3.1"]
    - qwen2.5-coder: ["llama3.1"]

litellm_settings:
  drop_params: true
  request_timeout: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
