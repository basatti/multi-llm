# Model manifest — what the inference layer serves.
# Every gateway route with `model_info.source: local` references one of these
# ids via `model_info.manifest_id`. CI enforces it (scripts/validate_routes.py).
#
# Current single-box deploy uses Ollama (hot-swap, three small models share one
# T4). Adapter/LoRA support and instance_class auto-scaling become relevant when
# we add a second box dedicated to a high-throughput pinned vLLM model.

models:
  - id: llama3.1-8b
    family: llama3.1
    weights_uri: s3://onetechhub-llm-weights/llama3.1-8b/  # pulled at runtime by ollama; tracked for parity
    revision: "ollama-registry-managed"
    serving:
      engine: ollama
      instance_class: g4dn.xlarge
      max_model_len: 8192
      replicas:
        min: 1
        max: 1
        scale_to_zero: false

  - id: gemma4-latest
    family: gemma4
    weights_uri: s3://onetechhub-llm-weights/gemma4-latest/
    revision: "ollama-registry-managed"
    serving:
      engine: ollama
      instance_class: g4dn.xlarge
      max_model_len: 8192
      replicas:
        min: 1
        max: 1
        scale_to_zero: false

  - id: qwen2.5-coder-7b
    family: qwen2.5-coder
    weights_uri: s3://onetechhub-llm-weights/qwen2.5-coder-7b/
    revision: "ollama-registry-managed"
    serving:
      engine: ollama
      instance_class: g4dn.xlarge
      max_model_len: 8192
      replicas:
        min: 1
        max: 1
        scale_to_zero: false
